[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbxplay"
version = "0.1.0"
description = "A Databricks-like interactive display() function for Jupyter Notebooks, AWS Glue, Google Colab, and VS Code."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Varun"}
]
dependencies = [
    "ipython>=7.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.0"]
polars = ["polars>=0.14"]
pyspark = ["pyspark>=3.0"]
all = ["pandas>=1.0", "polars>=0.14", "pyspark>=3.0"]
dev = ["pytest>=7.0", "pandas>=1.0"]

[tool.setuptools.packages.find]
include = ["dbxplay*"]
